<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ZDF Band Overwrite</title>
<style>
  :root {
    --accent: #FF6600;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e4e8;
    --text: #1c1e21;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0; width: 260px; background: var(--bg); color: var(--text);
  }
  .head { padding: 0.8rem 0.9rem 0.6rem; }
  .head h1 { font-size: 0.95rem; margin: 0; }
  .head h1 .dot { color: var(--accent); }

  .toggleRow {
    display: flex; align-items: center; gap: 0.6rem; width: 100%;
    padding: 0.5rem 0.7rem; background: var(--panel); border: 1px solid var(--border);
    border-radius: 7px; cursor: pointer; font: inherit; font-size: 0.85rem; text-align: left;
  }
  .toggleRow .dot2 {
    width: 0.8rem; height: 0.8rem; border-radius: 50%; background: #ccc; flex-shrink: 0;
  }
  .toggleRow.on .dot2 { background: var(--accent); }
  .toggleRow:hover { background: #f7f7f8; }
  .toggleRow .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toggleRow .state { color: var(--text-muted); font-size: 0.78rem; flex-shrink: 0; }

  .section { padding: 0 0.9rem 0.9rem; }
  .sectionLabel {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-muted); margin: 0 0 0.4rem; font-weight: 600;
  }
  .tplList, .toggleList { display: flex; flex-direction: column; gap: 0.3rem; }
  .tplBtn {
    display: block; width: 100%; text-align: left; padding: 0.5rem 0.7rem;
    border: 1px solid var(--border); background: var(--panel); border-radius: 7px;
    font: inherit; font-size: 0.85rem; cursor: pointer; color: var(--text);
  }
  .tplBtn:hover { background: #fff1e6; border-color: var(--accent); }
  .tplBtn:disabled { opacity: 0.6; cursor: default; }

  .hint { font-size: 0.82rem; color: var(--text-muted); margin: 0; }
  .hint a { color: var(--accent); cursor: pointer; }

  .abGroupBox select {
    width: 100%; padding: 0.45rem 0.6rem; font: inherit; font-size: 0.85rem;
    border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--text);
  }
  .abGroupCurrent { font-size: 0.78rem; color: var(--text-muted); margin: 0.4rem 0 0; }

  .footer {
    border-top: 1px solid var(--border); padding: 0.5rem 0.9rem;
    display: flex; justify-content: flex-end;
  }
  .footer a { font-size: 0.8rem; color: var(--text-muted); cursor: pointer; text-decoration: none; }
  .footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="head"><h1>ZDF Band <span class="dot">•</span> Overwrite</h1></div>

  <div class="section">
    <p class="sectionLabel">Bänder</p>
    <div class="toggleList" id="bandToggleList"></div>
  </div>

  <div class="section">
    <p class="sectionLabel">A/B-Gruppe</p>
    <div class="abGroupBox" id="abGroupBox"></div>
  </div>

  <div class="section">
    <p class="sectionLabel">GetJson</p>
    <p class="hint" id="pageTypeLabel" style="margin:0 0 .4rem;"></p>
    <div class="tplList" id="templateList"></div>
  </div>

  <div class="footer">
    <a id="openOptions">Einstellungen</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
